name: Desplegar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar calculadora
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar sitio
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f data.js
          test -f app.js
          test -f app-a1.js
          test -f app-a2.js
          test -f app-b.js
          test -f ui-a.html
          test -f ui-b.html
          test -f ui-c.html
          test "$(wc -c < app-a1.js)" -gt 10000
          test "$(wc -c < app-a2.js)" -gt 10000
          test "$(wc -c < app-b.js)" -gt 10000

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
