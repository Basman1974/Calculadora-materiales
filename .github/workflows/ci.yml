name: CI Calculadora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar calculadora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar archivos
        run: |
          set -euo pipefail
          for f in index.html style.css data.js app.js; do
            test -f "$f"
            echo "$f $(wc -c < "$f") bytes"
          done
          test "$(wc -c < index.html)" -gt 10000
          test "$(wc -c < style.css)" -gt 4000
          test "$(wc -c < data.js)" -gt 3000
          test "$(wc -c < app.js)" -gt 10000

      - name: Comprobar módulos y funciones
        run: |
          python3 - << 'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8', errors='replace')
          js = Path('app.js').read_text(encoding='utf-8', errors='replace') + Path('data.js').read_text(encoding='utf-8', errors='replace')
          missing = []
          for token in ['id="postal"','id="wall"','id="lining"','id="roof"','id="wet"','id="ceramic"','id="cBond"','data-cer-body','src="app.js"','src="data.js"','href="style.css"']:
              if token not in html: missing.append('html:'+token)
          for token in ['function calcWall','function calcLining','function calcRoof','function calcWet','function calcLevel','function pylFaceWork','function bestPylBoard','function mmScrews','function ceramicGlueKgM2','function adhesiveClass','CALC_DATA']:
              if token not in js: missing.append('js:'+token)
          if missing:
              print('Faltan:', missing)
              raise SystemExit(1)
          print('OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis JavaScript
        run: |
          node --check data.js
          node --check app.js
