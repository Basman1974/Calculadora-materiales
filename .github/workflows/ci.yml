name: CI Calculadora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar calculadora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar archivos
        run: |
          set -euo pipefail
          for f in index.html style.css data.js app.js app-a1.js app-a2.js app-b.js ui-a.html ui-b.html ui-c.html manifest.json service-worker.js; do
            test -f "$f"
            echo "$f $(wc -c < "$f") bytes"
          done
          test "$(wc -c < style.css)" -gt 4000
          test "$(wc -c < data.js)" -gt 3000
          test "$(wc -c < app-a1.js)" -gt 10000
          test "$(wc -c < app-a2.js)" -gt 10000
          test "$(wc -c < app-b.js)" -gt 10000

      - name: Comprobar interfaz y funciones
        run: |
          python3 - << 'PY'
          from pathlib import Path
          html = ''.join(Path(p).read_text(encoding='utf-8', errors='replace') for p in ['ui-a.html','ui-b.html','ui-c.html'])
          js = ''.join(Path(p).read_text(encoding='utf-8', errors='replace') for p in ['app-a1.js','app-a2.js','app-b.js']) + Path('data.js').read_text(encoding='utf-8', errors='replace')
          missing = []
          for token in ['id="postal"','id="wall"','id="lining"','id="roof"','id="wet"','id="ceramic"','id="wBoardThick"','id="lBoardThick"','id="cBond"','id="cPattern"','id="cThickness"','id="cJoint"','id="cTrowel"','id="priceCsv"','id="installApp"','data-cer-body','src="app.js?v=','src="data.js?v=','href="style.css']:
              if token not in html: missing.append('html:'+token)
          for token in ['function calcWall','function calcLining','function calcRoof','function calcWet','function calcLevel','function pylFaceWork','function bestPylBoard','function mmScrews','function ceramicGlueKgM2','function adhesiveClass','function groutKgM2','function rowConfidence','PLACO_HEIGHT_WALL','PLACO_HEIGHT_LINING','choosePlacoHeight','CALC_DATA']:
              if token not in js: missing.append('js:'+token)
          for forbidden in ['id="cerProductCode"','id="loadObramatCeramic"']:
              if forbidden in html: missing.append('obsoleto:'+forbidden)

          import re
          ids = re.findall(r'\bid="([^"]+)"', html)
          if len(ids) != len(set(ids)):
              missing.append('html:ids duplicados')

          screens = set(re.findall(r'<section[^>]+id="([^"]+)"', html))
          for target in re.findall(r'data-open="([^"]+)"', html):
              if target not in screens: missing.append('data-open:'+target)
          for target in re.findall(r'data-nav="([^"]+)"', html):
              if target not in screens: missing.append('data-nav:'+target)

          for form_id in re.findall(r'<form[^>]+id="([^"]+)"', html):
              if ("el('" + form_id + "')") not in js:
                  missing.append('form-sin-handler:'+form_id)

          critical = ['installApp','look','changePostal','useLocation','gateToggle','jobNew','jobSaveSnap','exportPrint','exportCsv','exportWa']
          for bid in critical:
              if ('id="' + bid + '"') not in html:
                  missing.append('boton-falta:'+bid)
              handled = ("el('" + bid + "')") in js or ("closest('#" + bid + "')") in js or ('id="' + bid + '"') in html and 'onclick=' in html
              if not handled:
                  missing.append('boton-sin-handler:'+bid)

          # Todas las familias de pestañas deben existir y tener lógica asociada.
          tabs = {
              'data-wall-preset':['vivienda','bano','doble'],
              'data-lining-type':['direct','semi','auto'],
              'data-lining-preset':['direct','semi','auto'],
              'data-roof-fam':['continuo','registrable','tradicional'],
              'data-roof-sys':['double','simple','sierra','cm70','desmontable60','desmontable120','escayola'],
              'data-cat':['ladrillos','bloques','revestimientos','puentes'],
              'data-cer-body':['porcelanico','pasta_roja','pasta_blanca'],
              'data-cer-tab':['level','adhesive'],
              'data-nav':['home','work','list','help'],
          }
          for attr, values in tabs.items():
              for value in values:
                  if (attr + '="' + value + '"') not in html:
                      missing.append('pestana-falta:'+attr+'='+value)
              camel = attr[5:].split('-')
              camel = camel[0] + ''.join(x.title() for x in camel[1:])
              if ('dataset.' + camel) not in js:
                  missing.append('pestana-sin-logica:'+attr)

          if 'cdn.jsdelivr.net/gh/Basman1974/Calculadora-materiales@' in Path('app.js').read_text(encoding='utf-8'):
              missing.append('loader:fallback-antiguo-remoto')
          if 'manifest.json' not in html:
              missing.append('pwa:manifest-no-enlazado')
          sw = Path('service-worker.js').read_text(encoding='utf-8')
          if 'ignoreSearch:true' not in sw:
              missing.append('pwa:cache-versionado-no-compatible')

          if missing:
              print('Faltan o sobran:', missing)
              raise SystemExit(1)
          print('OK: navegación, formularios y botones críticos enlazados')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis JavaScript
        run: |
          node --check data.js
          node --check service-worker.js
          cat app-a1.js app-a2.js app-b.js > /tmp/app-full.js
          node --check /tmp/app-full.js
          python3 -m json.tool manifest.json >/dev/null
