name: CI Calculadora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar calculadora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar archivos
        run: |
          set -euo pipefail
          for f in index.html style.css data.js app.js app-a1.js app-a2.js app-b.js ui-a.html ui-b.html ui-c.html; do
            test -f "$f"
            echo "$f $(wc -c < "$f") bytes"
          done
          test "$(wc -c < style.css)" -gt 4000
          test "$(wc -c < data.js)" -gt 3000
          test "$(wc -c < app-a1.js)" -gt 10000
          test "$(wc -c < app-a2.js)" -gt 10000
          test "$(wc -c < app-b.js)" -gt 10000

      - name: Comprobar interfaz y funciones
        run: |
          python3 - << 'PY'
          from pathlib import Path
          html = ''.join(Path(p).read_text(encoding='utf-8', errors='replace') for p in ['ui-a.html','ui-b.html','ui-c.html'])
          js = ''.join(Path(p).read_text(encoding='utf-8', errors='replace') for p in ['app-a1.js','app-a2.js','app-b.js']) + Path('data.js').read_text(encoding='utf-8', errors='replace')
          missing = []
          for token in ['id="postal"','id="wall"','id="lining"','id="roof"','id="wet"','id="ceramic"','id="wBoardThick"','id="lBoardThick"','id="cBond"','data-cer-body','src="app.js"','src="data.js"','href="style.css']:
              if token not in html: missing.append('html:'+token)
          for token in ['function calcWall','function calcLining','function calcRoof','function calcWet','function calcLevel','function pylFaceWork','function bestPylBoard','function mmScrews','function ceramicGlueKgM2','function adhesiveClass','PLACO_HEIGHT_WALL','PLACO_HEIGHT_LINING','choosePlacoHeight','CALC_DATA']:
              if token not in js: missing.append('js:'+token)
          for forbidden in ['id="cerProductCode"','id="loadObramatCeramic"']:
              if forbidden in html: missing.append('obsoleto:'+forbidden)
          if missing:
              print('Faltan o sobran:', missing)
              raise SystemExit(1)
          print('OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis JavaScript
        run: |
          node --check data.js
          cat app-a1.js app-a2.js app-b.js > /tmp/app-full.js
          node --check /tmp/app-full.js
