<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720">
<defs>
  <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#8d969c"/><stop offset=".18" stop-color="#edf2f4"/><stop offset=".48" stop-color="#aeb8be"/><stop offset=".75" stop-color="#f5f7f8"/><stop offset="1" stop-color="#7d888e"/></linearGradient>
  <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0de"/><stop offset="1" stop-color="#ddd1b7"/></linearGradient>
  <linearGradient id="wool" x1="0" x2="1"><stop stop-color="#e8cf78"/><stop offset=".5" stop-color="#cda94c"/><stop offset="1" stop-color="#f0d886"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".2"/></filter>
</defs>
<style>
.ttl{font:800 30px Arial,Helvetica,sans-serif;fill:#fff}.sub{font:700 13px Arial,Helvetica,sans-serif;fill:#181818}
.lab{font:700 14px Arial,Helvetica,sans-serif;fill:#181818}.small{font:12px Arial,Helvetica,sans-serif;fill:#181818}
.lead{stroke:#151515;stroke-width:1.6;fill:none}.dim{stroke:#111;stroke-width:1.4;fill:none}
.steel{fill:url(#metal);stroke:#485158;stroke-width:1.4}.pyl{fill:url(#board);stroke:#6f685b;stroke-width:1.5}
.ins{fill:url(#wool);stroke:#9a762d;stroke-width:1.2}.screw{fill:#222}.orange{fill:#e84912}
</style>
<rect width="540" height="720" fill="#fffdfa"/>
<rect class="orange" width="540" height="64"/><rect x="536" y="64" width="4" height="656" fill="#e84912"/><rect x="0" y="64" width="4" height="656" fill="#e84912"/>
<text class="ttl" x="24" y="43">TABIQUE PYL</text>
<text class="sub" x="24" y="88">Estructura de canal y montante · placas de yeso a ambas caras</text>

<!-- Vista 3D simplificada -->
<g transform="translate(40 112)" filter="url(#shadow)">
  <!-- placa cara 1 -->
  <path class="pyl" d="M60 54l80 26v246l-80-28z"/>
  <!-- estructura -->
  <path class="steel" d="M140 80l205-42 34 12-205 43z"/>
  <path class="steel" d="M140 314l205-27 34 12-205 28z"/>
  <path class="steel" d="M154 88l17-3v220l-17 4zM222 74l17-3v225l-17 4zM290 60l17-3v231l-17 4zM358 47l17-3v237l-17 4z"/>
  <!-- lana entre montantes -->
  <path class="ins" d="M174 96l44-9v199l-44 8zM242 82l44-9v205l-44 8zM310 68l44-9v211l-44 8z"/>
  <!-- placa cara 2 -->
  <path class="pyl" d="M174 93l204-43v246l-204 42z"/>
  <!-- tornillos cara 2 -->
  <g class="screw">
    <circle cx="186" cy="112" r="2"/><circle cx="186" cy="165" r="2"/><circle cx="186" cy="218" r="2"/><circle cx="186" cy="271" r="2"/><circle cx="186" cy="318" r="2"/>
    <circle cx="365" cy="75" r="2"/><circle cx="365" cy="128" r="2"/><circle cx="365" cy="181" r="2"/><circle cx="365" cy="234" r="2"/><circle cx="365" cy="282" r="2"/>
  </g>
  <!-- cota de modulación -->
  <path class="dim" d="M162 47L229 34M162 41v12M229 28v12"/><text class="lab" x="174" y="25">400 / 600 mm</text>
</g>

<!-- Sección -->
<g transform="translate(58 468)">
  <text class="lab" x="0" y="-18">SECCIÓN DEL SISTEMA</text>
  <!-- placa izquierda -->
  <rect class="pyl" x="20" y="0" width="22" height="188"/>
  <!-- canal/montante -->
  <rect class="steel" x="64" y="0" width="18" height="188"/>
  <rect class="steel" x="64" y="0" width="72" height="11"/>
  <rect class="steel" x="64" y="177" width="72" height="11"/>
  <!-- lana -->
  <rect class="ins" x="83" y="20" width="52" height="148"/>
  <!-- placa derecha -->
  <rect class="pyl" x="137" y="0" width="22" height="188"/>

  <path class="lead" d="M31 36h171"/><circle cx="31" cy="36" r="3"/><text class="lab" x="213" y="41">Placa PYL · cara 1</text>
  <path class="lead" d="M73 78h129"/><circle cx="73" cy="78" r="3"/><text class="lab" x="213" y="83">Montante metálico</text>
  <path class="lead" d="M108 116h94"/><circle cx="108" cy="116" r="3"/><text class="lab" x="213" y="121">Lana mineral</text>
  <path class="lead" d="M148 154h54"/><circle cx="148" cy="154" r="3"/><text class="lab" x="213" y="159">Placa PYL · cara 2</text>
  <text class="small" x="213" y="184">Canal superior e inferior con banda acústica</text>
</g>
</svg>