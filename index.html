<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Materiales</title>
    <!-- Librería para generar el PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --color-primario: #0056b3;
            --color-secundario: #ff6600; 
            --color-secundario-suave: #fff7f0; 
            --color-resultado: #059669;
            --color-whatsapp: #25D366;
            --color-email: #4f46e5;
            --color-fondo-pantalla: #e2e8f0; 
            --color-fondo-app: #ffffff; 
            --color-texto: #222222;
            --color-etiquetas: #444444; 
            --color-borde: #cbd5e1;
            --color-peligro: #ef4444;
            --fuente-principal: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            font-family: var(--fuente-principal);
            padding: 20px;
            max-width: 550px;
            margin: 0 auto;
            background-color: var(--color-fondo-pantalla);
            color: var(--color-texto);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .contenedor-app {
            background-color: var(--color-fondo-app);
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .marca-agua-top {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 200px;
            height: auto;
        }

        .encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--color-borde);
            padding-bottom: 15px;
        }

        h2 { 
            color: var(--color-primario); 
            margin: 0;
            font-size: 22px;
            font-weight: 800;
        }

        .btn-ayuda-ico {
            background-color: #e2e8f0;
            color: var(--color-primario);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
        }

        .btn-ayuda-ico:hover {
            background-color: var(--color-borde);
        }

        .grupo-formulario {
            margin-bottom: 22px;
        }

        .contenedor-imagen-centrada {
            text-align: center;
            margin-bottom: 22px;
            display: none; 
            padding: 10px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px dashed var(--color-borde);
        }

        .imagen-producto {
            max-width: 160px;
            height: auto;
            border-radius: 6px;
        }

        label { 
            font-weight: 700; 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: var(--color-etiquetas);
            text-transform: uppercase; 
        }

        select, input {
            font-family: var(--fuente-principal);
            width: 100%;
            padding: 14px 15px;
            border: 2px solid var(--color-borde);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        select {
            background-color: var(--color-secundario-suave);
            border-left: 5px solid var(--color-secundario);
            font-weight: 700; 
        }

        .fila-medidas {
            display: flex;
            gap: 15px;
        }
        .columna-mitad { flex: 1; }

        .botones-formulario {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            font-family: var(--fuente-principal);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            padding: 14px;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }

        .btn-primario { flex: 2; background-color: var(--color-primario); color: white; }
        .btn-secundario { flex: 1; background-color: transparent; color: var(--color-primario); border: 2px solid var(--color-primario); }
        .btn-agregar-carrito { width: 100%; background-color: var(--color-secundario); color: white; margin-top: 20px; padding: 16px; font-size: 16px;}

        .resultado-container {
            margin-top: 30px;
            display: none;
            padding-top: 25px;
            border-top: 2px dashed var(--color-borde);
        }

        .resultado-titulo { text-align: center; color: var(--color-resultado); font-weight: 800; }
        .resultado-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }

        .casilla {
            background-color: rgba(5, 150, 105, 0.05);
            border: 2px solid var(--color-resultado);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .casilla-etiqueta { font-size: 12px; color: var(--color-etiquetas); font-weight: 800; }
        .casilla-valor { font-size: 26px; font-weight: 900; color: var(--color-resultado); }
        .casilla-nota { font-size: 11px; color: #555; margin-top: 5px; }
        .casilla-destacada { background-color: var(--color-resultado); color: white; }
        .casilla-destacada .casilla-etiqueta, .casilla-destacada .casilla-valor, .casilla-destacada .casilla-nota { color: white; }

        .contenedor-carrito {
            margin-top: 40px;
            display: none;
            padding: 20px;
            background-color: #f8fafc;
            border: 2px solid var(--color-primario);
            border-radius: 12px;
        }

        .titulo-carrito { color: var(--color-primario); text-align: center; margin-top: 0;}
        .item-carrito {
            background-color: white;
            border: 1px solid var(--color-borde);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-eliminar-item { background-color: var(--color-peligro); color: white; padding: 8px; }

        .grid-botones-export {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-export {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: none;
            color: white;
        }

        .btn-copiar { background-color: var(--color-etiquetas); }
        .btn-pdf { background-color: #dc2626; }
        .btn-pdf:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-whatsapp { background-color: var(--color-whatsapp); }
        .btn-email { background-color: var(--color-email); }

        .marca-agua { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 30px; font-weight: 600; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="contenedor-app">
        <div class="marca-agua-top">© 2026 Elías López</div>

        <div class="logo-container">
            <img src="LOGO OBRAMAT.PNG" alt="Logo">
        </div>

        <div class="encabezado">
            <h2>Calculadora</h2>
        </div>

        <div class="grupo-formulario">
            <label for="categoria">Categoría constructiva:</label>
            <select id="categoria" onchange="actualizarOpciones()" oninput="ocultarResultados()">
                <option value="">Selecciona una categoría...</option>
                <option value="ladrillos">Ladrillos</option>
                <option value="bloques">Bloques de Hormigón</option>
                <option value="revestimientos">Revestimientos</option>
                <option value="puentes">Puentes de Unión</option>
            </select>
        </div>

        <div class="grupo-formulario">
            <label for="producto">Producto específico:</label>
            <select id="producto" onchange="actualizarOpcionesProducto()" oninput="ocultarResultados()">
                <option value="">Selecciona un producto...</option>
            </select>
        </div>

        <div id="contenedor-img" class="contenedor-imagen-centrada">
            <img id="img-dinamica" src="" alt="Vista del producto" class="imagen-producto">
        </div>

        <div id="div-soporte" class="grupo-formulario" style="display:none;">
            <label for="tipo-soporte">Tipo de Soporte (Dilución):</label>
            <select id="tipo-soporte" oninput="ocultarResultados()">
                <option value="sin_absorcion">Soporte sin absorción (Dilución 1:1, 1 capa)</option>
                <option value="poco_poroso">Soporte poco poroso (Dilución 1:1.5, 1 capa)</option>
                <option value="poroso">Soporte poroso (Dilución 1:2 y 1:1.5, 2 capas)</option>
            </select>
        </div>

        <div id="contenedor-medidas" style="display:none;">
            <div class="grupo-formulario">
                <label for="modo-medida">Cálculo de superficie:</label>
                <select id="modo-medida" onchange="cambiarModoMedida()" oninput="ocultarResultados()">
                    <option value="directo">Introducir m² totales</option>
                    <option value="dimensiones">Calcular por medidas (L x A)</option>
                </select>
            </div>

            <div id="div-m2-directo" class="grupo-formulario">
                <label for="medida">Metros Cuadrados (m²):</label>
                <input type="number" id="medida" min="0.1" value="1" inputmode="decimal" step="0.01" oninput="ocultarResultados()">
            </div>

            <div id="div-dimensiones" class="grupo-formulario fila-medidas" style="display:none;">
                <div class="columna-mitad">
                    <label for="largo">Largo (m):</label>
                    <input type="number" id="largo" min="0.1" value="1" inputmode="decimal" step="0.01">
                </div>
                <div class="columna-mitad">
                    <label for="alto">Alto (m):</label>
                    <input type="number" id="alto" min="0.1" value="1" inputmode="decimal" step="0.01">
                </div>
            </div>
        </div>

        <div id="div-espesor" class="grupo-formulario" style="display:none;">
            <label for="espesor">Espesor (mm):</label>
            <input type="number" id="espesor" min="1" value="1" inputmode="decimal">
        </div>

        <div id="div-merma" class="grupo-formulario" style="display:none;">
            <label for="merma">Margen de merma:</label>
            <select id="merma">
                <option value="0" selected>0% (Teórico)</option>
                <option value="5">5% (Mínima)</option>
                <option value="8">8% (Estándar)</option>
                <option value="10">10% (Alta)</option>
            </select>
        </div>

        <div class="botones-formulario">
            <button class="btn-primario" onclick="calcular()">Calcular</button>
            <button class="btn-secundario" onclick="limpiarCalculadora()">Limpiar</button>
        </div>

        <div id="resultado" class="resultado-container"></div>

        <!-- CARRITO DE OBRA -->
        <div id="contenedor-carrito" class="contenedor-carrito">
            <h3 class="titulo-carrito">🛒 Lista de Materiales</h3>
            <div id="lista-carrito"></div>
            
            <div class="grid-botones-export">
                <button class="btn-export btn-pdf" onclick="generarPDF()">📄 Descargar PDF</button>
                <button class="btn-export btn-copiar" onclick="copiarCarrito()">📋 Copiar</button>
                <button class="btn-export btn-email" onclick="enviarPorEmail()">✉️ Email</button>
                <button class="btn-export btn-whatsapp" onclick="enviarCarritoWhatsApp()">💬 WhatsApp</button>
            </div>
        </div>

        <div class="marca-agua">© 2026 Elías López</div>
    </div>

    <script>
        const datos = {
            ladrillos: {
                "Hueco sencillo 33x16.5x4": { udsM2: 18, mortero: 18, palet: 630, peso: 1.5 },
                "Hueco doble 33x20x7": { udsM2: 15, mortero: 23, palet: 270, peso: 3.1 },
                "Hueco triple 33x20x11": { udsM2: 15, mortero: 30, palet: 180, peso: 4.87 },
                "Termocerámico 14 cm": { udsM2: 15, mortero: 40, palet: 135, peso: 6.5 },
                "Termocerámico 20 cm": { udsM2: 15, mortero: 56, palet: 105, peso: 9.0 },
                "Termocerámico 24 cm": { udsM2: 15, mortero: 67, palet: 90, peso: 10.1 },
                "Termocerámico 29 cm": { udsM2: 15, mortero: 81, palet: 75, peso: 12.20 },
                "Perforado 10 cm": { udsM2: 40, mortero: 60, palet: 360, peso: 2.3 },
                "Perforado 20 cm": { udsM2: 20, mortero: 35, palet: 180, peso: 4.2 },
                "Rojo liso caravista 24x12x5": { udsM2: 67, mortero: null, palet: 578, peso: 1.15 }
            },
            bloques: {
                "Bloque ligero gris 39x19x19": { udsM2: 13.5, peso: 14.1, palet: 90, mortero: 100 },
                "Bloque tapado gris 39x19x19": { udsM2: 13.5, peso: 13.0, palet: 90, mortero: 87.5 },
                "Bloque redondo gris 39x19x19": { udsM2: 13.5, peso: 16.0, palet: 75, mortero: 87.5 },
                "Bloque ligero blanco 39x19x19": { udsM2: 13.5, peso: 14.1, palet: 90, mortero: 100 },
                "Bloque tapado gris 39x19x15": { udsM2: 13.5, peso: 12.48, palet: 105, mortero: 75 },
                "Bloque gris 39x19x10": { udsM2: 13.5, peso: 9.0, palet: 132, mortero: 50 }
            },
            revestimientos: {
                "weber.rev fino": { kgMm: 1.7, maxMm: 5 },
                "weberpral prisma": { kgMm: 1.5, maxMm: 30 },
                "weberev hidro PLUS": { kgMm: 1.8, maxMm: 20 },
                "APLICAREV Cal Nature Pro": { kgMm: 1.9, maxMm: 20 }
            },
            puentes: {
                "Puente de unión PLUS (MH)": { min: 0.200, max: 0.250, tipo: "litros", imagen: "puente-union-plus.jpg" },
                "SikaTop-30": { min: 0.150, max: 0.175, tipo: "litros" },
                "SikaTop-50": { min: 0.125, max: 0.150, tipo: "litros" },
                "SikaTop®-10": { min: 0.8, max: 0.8, densidad: 1.32, tipo: "sikatop10", imagen: "sikatop-10.jpg" },
                "Puente de Unión Morteros Henares (PTU-20)": { min: 0.400, max: 0.450, densidad: 1.4, tipo: "rango_kilos" },
                "Aplica primer TOP 5KG": { min: 0.125, max: 0.175, densidad: 1.43, tipo: "rango_kilos" },
                "Imprimacion Aplica Level Primer 5 L": { tipo: "level_primer", imagen: "level-primer.jpg" }
            }
        };

        let carritoDeObra = [];
        let calculoTemporal = null;

        function ocultarResultados() {
            document.getElementById("resultado").style.display = "none";
            calculoTemporal = null; 
        }

        function cambiarModoMedida() {
            const modo = document.getElementById("modo-medida").value;
            document.getElementById("div-m2-directo").style.display = modo === "directo" ? "block" : "none";
            document.getElementById("div-dimensiones").style.display = modo === "dimensiones" ? "flex" : "none";
            ocultarResultados();
        }

        function limpiarCalculadora() {
            document.getElementById("categoria").value = "";
            document.getElementById("producto").innerHTML = '<option value="">Selecciona un producto...</option>';
            document.getElementById("modo-medida").value = "directo";
            document.getElementById("medida").value = "1";
            document.getElementById("largo").value = "1";
            document.getElementById("alto").value = "1";
            document.getElementById("espesor").value = "1";
            document.getElementById("merma").value = "0"; 
            
            document.getElementById("contenedor-medidas").style.display = "none";
            document.getElementById("div-espesor").style.display = "none";
            document.getElementById("div-merma").style.display = "none";
            document.getElementById("div-soporte").style.display = "none";
            document.getElementById("contenedor-img").style.display = "none";
            
            cambiarModoMedida();
            ocultarResultados();
        }

        function actualizarOpciones() {
            const categoria = document.getElementById("categoria").value;
            const productoSelect = document.getElementById("producto");
            
            productoSelect.innerHTML = '<option value="">Selecciona un producto...</option>';
            document.getElementById("div-soporte").style.display = "none";
            document.getElementById("contenedor-img").style.display = "none";
            ocultarResultados();
            
            document.getElementById("contenedor-medidas").style.display = categoria ? "block" : "none";
            document.getElementById("div-espesor").style.display = categoria === "revestimientos" ? "block" : "none";
            document.getElementById("div-merma").style.display = categoria ? "block" : "none";

            document.getElementById("merma").value = (categoria === "puentes") ? "0" : "8";

            if (categoria && datos[categoria]) {
                for (const key in datos[categoria]) {
                    let option = document.createElement("option");
                    option.value = key; option.text = key;
                    productoSelect.appendChild(option);
                }
            }
        }

        function actualizarOpcionesProducto() {
            ocultarResultados();
            const categoria = document.getElementById("categoria").value;
            const producto = document.getElementById("producto").value;
            
            document.getElementById("div-soporte").style.display = (producto === "Imprimacion Aplica Level Primer 5 L") ? "block" : "none";

            const divImg = document.getElementById("contenedor-img");
            const imgElemento = document.getElementById("img-dinamica");
            if (categoria && producto && datos[categoria][producto] && datos[categoria][producto].imagen) {
                imgElemento.src = datos[categoria][producto].imagen;
                divImg.style.display = "block";
            } else {
                divImg.style.display = "none";
            }
        }

        function calcular() {
            const categoria = document.getElementById("categoria").value;
            const producto = document.getElementById("producto").value;
            const modoMedida = document.getElementById("modo-medida").value;
            
            let medida = 0, textoMedida = "";
            if (modoMedida === "directo") {
                medida = parseFloat(document.getElementById("medida").value) || 0;
                textoMedida = `${medida} m²`;
            } else {
                const largo = parseFloat(document.getElementById("largo").value) || 0;
                const alto = parseFloat(document.getElementById("alto").value) || 0;
                medida = parseFloat((largo * alto).toFixed(2));
                textoMedida = `${medida} m² (Pared de ${largo}m x ${alto}m)`;
            }

            const espesor = parseFloat(document.getElementById("espesor").value) || 0;
            const mermaSeleccionada = parseFloat(document.getElementById("merma").value) || 0;
            const factorMerma = 1 + (mermaSeleccionada / 100);

            if (!categoria || !producto || medida <= 0) return alert("Completa los campos correctamente.");

            const item = datos[categoria][producto];
            let html = `<h3 class="resultado-titulo">RESULTADO<br><small style="font-size:14px; color:#555;">${textoMedida}</small></h3><div class="resultado-grid">`;
            let detallesTexto = ""; 

            if (categoria === "ladrillos" || categoria === "bloques") {
                const totalUds = Math.ceil((item.udsM2 * medida) * factorMerma); 
                const pesoTotal = (totalUds * item.peso).toFixed(2);
                detallesTexto += `Unidades: ${totalUds} uds (Inc. ${mermaSeleccionada}% merma)\nPeso total: ${pesoTotal} kg\n`;
                html += `<div class="casilla"><div class="casilla-etiqueta">Unidades</div><div class="casilla-valor">${totalUds}</div></div>`;
                
                if (item.palet) {
                    const totalPalets = (totalUds / item.palet).toFixed(2);
                    detallesTexto += `Palets (aprox): ${totalPalets}\n`;
                }
                if (item.mortero) {
                    const sacosMortero = Math.ceil(((item.mortero * medida) * factorMerma) / 25);
                    detallesTexto += `Sacos de mortero (25kg): ${sacosMortero}\n`;
                    html += `<div class="casilla casilla-destacada"><div class="casilla-etiqueta">Sacos Mortero</div><div class="casilla-valor">${sacosMortero}</div></div>`;
                }
            } else if (categoria === "revestimientos") {
                const totalKilos = (item.kgMm * espesor) * medida * factorMerma; 
                const sacosNecesarios = Math.ceil(totalKilos / 25); 
                detallesTexto += `Espesor: ${espesor} mm\nSacos (25kg): ${sacosNecesarios} (Inc. ${mermaSeleccionada}% merma)\n`;
                html += `<div class="casilla casilla-destacada"><div class="casilla-etiqueta">Sacos a pedir</div><div class="casilla-valor">${sacosNecesarios}</div></div>`;
            } else if (categoria === "puentes") {
                if (item.tipo === "level_primer") {
                    const consumo = document.getElementById("tipo-soporte").value === "sin_absorcion" ? 0.075 : (document.getElementById("tipo-soporte").value === "poco_poroso" ? 0.060 : 0.110);
                    const botes = Math.ceil(((medida * consumo) * factorMerma) / 5);
                    detallesTexto += `Botes de 5L: ${botes}\n`;
                    html += `<div class="casilla casilla-destacada"><div class="casilla-etiqueta">Botes 5L</div><div class="casilla-valor">${botes}</div></div>`;
                } else if (item.tipo === "sikatop10" || item.tipo === "rango_kilos") {
                    const consumo = item.tipo === "sikatop10" ? item.min : (item.min + item.max) / 2;
                    const litros = Math.ceil(((medida * consumo) * factorMerma) / item.densidad);
                    detallesTexto += `Total estimado: ${litros} Litros\n`;
                    html += `<div class="casilla casilla-destacada"><div class="casilla-etiqueta">Litros</div><div class="casilla-valor">${litros}</div></div>`;
                } else {
                    const litros = Math.ceil((medida * ((item.min + item.max) / 2)) * factorMerma);
                    detallesTexto += `Total estimado: ${litros} Litros\n`;
                    html += `<div class="casilla casilla-destacada"><div class="casilla-etiqueta">Litros</div><div class="casilla-valor">${litros}</div></div>`;
                }
            }

            html += `</div><button class="btn-agregar-carrito" onclick="agregarAlCarrito()">🛒 AÑADIR A LA LISTA</button>`;
            
            calculoTemporal = { producto: producto, textoMedida: textoMedida, detallesTexto: detallesTexto };
            
            const divRes = document.getElementById("resultado");
            divRes.innerHTML = html;
            divRes.style.display = "block";
        }

        function agregarAlCarrito() {
            if (calculoTemporal) {
                carritoDeObra.push(calculoTemporal);
                renderizarCarrito();
                document.getElementById("resultado").style.display = "none";
                calculoTemporal = null;
            }
        }

        function renderizarCarrito() {
            const contenedor = document.getElementById("contenedor-carrito");
            const lista = document.getElementById("lista-carrito");
            if (carritoDeObra.length === 0) return contenedor.style.display = "none";
            
            contenedor.style.display = "block";
            let html = "";
            carritoDeObra.forEach((item, index) => {
                html += `<div class="item-carrito">
                    <div><strong>${index+1}. ${item.producto}</strong><br><small>${item.textoMedida}</small></div>
                    <button class="btn-eliminar-item" onclick="eliminarDelCarrito(${index})">🗑️</button>
                </div>`;
            });
            lista.innerHTML = html;
        }

        function eliminarDelCarrito(index) { carritoDeObra.splice(index, 1); renderizarCarrito(); }

        function generarTextoPlano() {
            let texto = "*Cotización de Materiales:*\n\n";
            carritoDeObra.forEach((item, i) => {
                texto += `📦 *${i + 1}. ${item.producto}*\n📏 Superficie: ${item.textoMedida}\n${item.detallesTexto.replace(/🔸/g, '•')}\n───────────────\n\n`;
            });
            texto += `⚠️ Cláusula. No es contractual, es solo a nivel informativo.`;
            return texto;
        }

        function copiarCarrito() {
            if(carritoDeObra.length === 0) return;
            navigator.clipboard.writeText(generarTextoPlano()).then(() => alert("Copiado al portapapeles"));
        }

        function enviarCarritoWhatsApp() {
            if(carritoDeObra.length === 0) return;
            window.open('https://wa.me/?text=' + encodeURIComponent(generarTextoPlano()), '_blank');
        }

        function enviarPorEmail() {
            if(carritoDeObra.length === 0) return;
            const subject = encodeURIComponent("Presupuesto de Materiales");
            const body = encodeURIComponent("Adjunto la cotización de materiales generada:\n\n" + generarTextoPlano() + "\n\n(No olvides adjuntar el archivo PDF si lo descargaste).");
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function generarPDF() {
            if(carritoDeObra.length === 0) return;
            
            const btn = document.querySelector('.btn-pdf');
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = "⏳ Generando...";
            btn.disabled = true;

            const hoy = new Date();
            const fechaTexto = hoy.toLocaleDateString('es-ES');

            // Formatear los ítems asegurando saltos de línea sin <pre> (que a veces da problemas en PDF)
            let htmlItems = "";
            carritoDeObra.forEach((item, i) => {
                const detallesLimpios = item.detallesTexto.trim().replace(/\n/g, '<br>• ');
                htmlItems += `
                <div style="border-bottom: 1px solid #eee; padding: 15px 0;">
                    <h4 style="margin: 0 0 5px 0; color: #0056b3; font-size: 16px;">${i + 1}. ${item.producto}</h4>
                    <p style="margin: 0 0 8px 0; font-size: 13px; color: #555;"><strong>Superficie:</strong> ${item.textoMedida}</p>
                    <div style="margin: 0; font-size: 12px; color: #222; font-family: inherit; line-height: 1.5;">• ${detallesLimpios}</div>
                </div>`;
            });

            // En lugar de inyectar en el DOM, le pasamos una CADENA DE TEXTO exacta a html2pdf. 
            // Esto asegura que renderiza en su motor interno sin depender del navegador visible.
            // Uso de <table> en la cabecera para garantizar un maquetado rígido 100% infalible.
            const htmlString = `
                <div style="padding: 20px; font-family: Helvetica, Arial, sans-serif; color: #333; width: 100%; box-sizing: border-box; background: white;">
                    <table style="width: 100%; margin-bottom: 30px; border-bottom: 2px solid #0056b3; padding-bottom: 15px; border-collapse: collapse;">
                        <tr>
                            <td style="font-size: 24px; font-weight: 900; color: #0056b3; vertical-align: bottom; padding: 0;">ESTIMACIÓN DE<br>MATERIALES</td>
                            <td style="text-align: right; font-size: 12px; color: #666; vertical-align: bottom; padding: 0;">Fecha: ${fechaTexto}<br>© 2026 Elías López</td>
                        </tr>
                    </table>
                    
                    <div>${htmlItems}</div>
                    
                    <div style="margin-top: 40px; font-size: 10px; color: #777; text-align: justify; border-top: 1px solid #ccc; padding-top: 15px;">
                        <strong>Cláusula:</strong> No es contractual, es solo a nivel informativo. Las cantidades expuestas son estimaciones teóricas basadas en las especificaciones técnicas de los fabricantes. El consumo real puede variar dependiendo del estado del soporte, las herramientas utilizadas y el método de aplicación.
                    </div>
                </div>
            `;

            const opt = {
                margin:       15,
                filename:     'Presupuesto_Materiales.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Mandamos el HTML directamente como string, sin hackear el DOM.
            html2pdf().set(opt).from(htmlString).save().then(() => {
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }).catch(err => {
                console.error("Error al generar PDF:", err);
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
                alert("Hubo un error al crear el PDF. Inténtalo de nuevo.");
            });
        }
    </script>
</body>
</html>
