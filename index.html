<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#285940">
  <title>Calculadora Construcción</title>
  <link rel="icon" href="logo.png">
</head>
<body>
<script>
(async function () {
  try {
    var files = ['ui-a.html?v=20260926-cerwedge2', 'ui-b.html?v=20260926-cerwedge2', 'ui-c.html?v=20260926-cerwedge2'];
    var parts = await Promise.all(files.map(function (f) { return fetch(f).then(function (r) { if (!r.ok) throw new Error(f); return r.text(); }); }));
    document.open();
    document.write(parts.join(''));
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="font:16px system-ui;padding:24px">No se pudo cargar la calculadora. Recarga la página.</p>';
  }
})();
</script>
</body>
</html>
